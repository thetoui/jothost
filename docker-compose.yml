# JotHost Panel — development environment.
#
# Windows is only the host OS: every Linux-specific behaviour runs inside these
# containers (ARCHITECTURE.md section 16).
#
# Bring the stack up with:  make dev      (or: docker compose up -d --build)

name: jothost

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jothost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jothost_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jothost}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jothost} -d ${POSTGRES_DB:-jothost}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      target: runtime
    environment:
      JOTHOST_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      AGENT_SOCKET: /run/jothost/agent.sock
      AGENT_OPERATION_TIMEOUT: 30s
      AGENT_MAX_CONCURRENT: 16
      # Shared secret authenticating the API to the Agent. Development default
      # only; production must supply its own.
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-agent-token-0123456789abcdef0123456789abcdef}
      # UID 10001 is the API container's jothost user. Peer credentials come
      # from the kernel and cannot be forged by the caller.
      AGENT_ALLOWED_UIDS: ${AGENT_ALLOWED_UIDS:-10001}
      AGENT_AUDIT_LOG: /var/log/jothost/agent-audit.log
      AGENT_MAX_CONCURRENT_JOBS: 4
      AGENT_JOB_RETENTION: 15m
      # Alpine puts nginx in /usr/sbin and the shadow tools in /usr/sbin.
      AGENT_NGINX_PATH: /usr/sbin/nginx
      AGENT_NGINX_SITES_DIR: /etc/nginx/conf.d
      AGENT_SITE_ROOT: /var/www
      # Both database servers run inside this container, reached over their
      # Unix sockets. Neither listens on a port, and neither is the panel's own
      # control-plane PostgreSQL, which is a separate service.
      AGENT_MYSQL_PATH: /usr/bin/mariadb
      AGENT_MYSQL_SOCKET: /run/mysqld/mysqld.sock
      AGENT_MYSQL_ADMIN_USER: root
      AGENT_PSQL_PATH: /usr/bin/psql
      AGENT_POSTGRES_HOST: /run/postgresql
      AGENT_POSTGRES_ADMIN_USER: postgres
      # Development default only. Production supplies its own; the Agent never
      # puts it in argv, only in a mode-0600 pgpass file it reads through
      # PGPASSFILE.
      AGENT_POSTGRES_ADMIN_PASSWORD: ${AGENT_POSTGRES_ADMIN_PASSWORD:-jothost_pg_admin_dev}
    ports:
      # Websites the panel creates are served by the nginx this container
      # manages. This is the managed host's HTTP port, not the panel's.
      - "${SITES_PORT:-8090}:80"
      # HTTPS for the sites the panel creates, so the certificate a site is
      # issued can actually be handshaken with from the host.
      - "${SITES_TLS_PORT:-8443}:443"
    volumes:
      # The socket directory is the only channel between API and Agent.
      # No port is published: the Agent must never be reachable over TCP.
      - agent-socket:/run/jothost
      - agent-audit:/var/log/jothost
      # Website content survives a rebuild of this image.
      #
      # This container is the managed host in development, and its filesystem is
      # otherwise thrown away every time the image is rebuilt — which silently
      # deletes every site while the database goes on listing them as active.
      # Vhosts, FPM pools and system accounts are all regenerated by the panel;
      # what a customer put in their document root is not.
      - agent-sites:/var/www
      # Managed database data, kept for the same reason as the site content
      # above: rebuilding this image would otherwise silently destroy every
      # database while the panel went on listing them as active.
      - agent-mysql:/var/lib/mysql
      - agent-pgdata:/var/lib/postgresql
      # The Phase 2 checks run inside this container, against a live Agent.
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/jothost-agent", "-ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot initialises two database servers before the Agent starts,
      # which takes far longer than a restart does.
      start_period: 90s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    environment:
      JOTHOST_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      API_HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-jothost}:${POSTGRES_PASSWORD:-jothost_dev_password}@postgres:5432/${POSTGRES_DB:-jothost}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AGENT_SOCKET: /run/jothost/agent.sock
      AGENT_TIMEOUT: 30s
      # Must match the Agent's AGENT_TOKEN.
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-agent-token-0123456789abcdef0123456789abcdef}
      MIGRATIONS_DIR: /app/migrations
      AUTO_MIGRATE: "true"
      # Development key only. Production must supply its own; losing it makes
      # every stored 2FA secret undecryptable.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_IP_RATE_LIMIT: ${LOGIN_IP_RATE_LIMIT:-20}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-15m}
      TOTP_ISSUER: ${TOTP_ISSUER:-JotHost Panel}
      METRIC_SAMPLE_INTERVAL: ${METRIC_SAMPLE_INTERVAL:-30s}
      METRIC_RETENTION: ${METRIC_RETENTION:-720h}
      DASHBOARD_SERVICES: ${DASHBOARD_SERVICES:-nginx,php-fpm,postgresql,redis}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - agent-socket:/run/jothost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Source is bind-mounted for hot reload; node_modules stays in the image
      # so Linux-native binaries are not overwritten by the Windows host tree.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PANEL_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  agent-socket:
  agent-audit:
  agent-sites:
  agent-mysql:
  agent-pgdata:
