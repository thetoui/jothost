name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [shared, api, agent]

    # The api suite exercises real Postgres and Redis rather than mocks; the
    # other modules ignore these and skip their database-backed tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jothost_test
          POSTGRES_PASSWORD: jothost_test
          POSTGRES_DB: jothost_test
        options: >-
          --health-cmd "pg_isready -U jothost_test -d jothost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6379:6379

    env:
      TEST_DATABASE_URL: postgres://jothost_test:jothost_test@localhost:5432/jothost_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_MIGRATIONS_DIR: ${{ github.workspace }}/migrations

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # The Go modules have no third-party dependencies, so there is no
          # go.sum to key a module cache on.
          cache: false

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      # The race detector matters most here: the Agent serves concurrent
      # connections and the API drains requests during shutdown.
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -p 1 -race -count=1 ./...

      # A short run of every fuzz target on each push. The seed corpus alone
      # is exercised by `go test`; this drives the fuzzer itself for a bounded
      # time so a regression in a validator's boundary shows up as a failing
      # build rather than waiting for someone to run it by hand. The shared
      # module is where the validators and their fuzz targets live.
      - name: fuzz the validators
        if: matrix.module == 'shared'
        working-directory: shared
        run: |
          for target in $(grep -roh '^func Fuzz[A-Za-z0-9_]*' ./validate | sed 's/^func //'); do
            echo "--- $target"
            go test ./validate/ -run="^$target\$" -fuzz="^$target\$" -fuzztime=30s
          done

      # The Agent runs as root and the API holds every credential the panel
      # has. A known advisory in a dependency is worth failing a build for.
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  integration:
    name: Docker integration
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for healthy services
        run: |
          for _ in $(seq 1 40); do
            state="$(docker compose ps --format '{{.Health}}' api nginx | sort -u | tr '\n' ' ')"
            case "$state" in
              *unhealthy*) echo "A service is unhealthy"; docker compose ps; exit 1 ;;
            esac
            if [ "$state" = "healthy " ]; then
              echo "Stack is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for healthy services"
          docker compose ps
          exit 1

      - name: Run Phase 0 integration checks
        run: docker compose -f docker-compose.test.yml run --rm integration

      - name: Create the integration administrator
        run: |
          docker compose exec -T -e JOTHOST_ADMIN_USERNAME=integration_admin -e JOTHOST_ADMIN_PASSWORD=integration-admin-pw-9271 api jothost-api create-admin

      - name: Run Phase 1 authentication checks
        run: docker compose -f docker-compose.test.yml run --rm auth-integration

      - name: Run Phase 2 Host Agent checks
        run: docker compose exec -T agent sh /tests/integration/phase2_agent.sh

      - name: Run Phase 3 dashboard checks
        run: docker compose -f docker-compose.test.yml run --rm dashboard-integration

      - name: Run Phase 4 website checks
        run: docker compose -f docker-compose.test.yml run --rm websites-integration

      # Phase 5 writes PHP files into a site's document root, which only the
      # managed host can do, so it runs inside the agent container.
      - name: Run Phase 5 PHP checks
        run: docker compose exec -T agent sh /tests/integration/phase5_php.sh

      # Phase 6 inspects private key permissions on disk, which only the
      # managed host can do, so it runs inside the agent container.
      - name: Run Phase 6 SSL checks
        run: docker compose exec -T agent sh /tests/integration/phase6_ssl.sh

      # Phase 7 verifies every file operation on disk after the API reports it,
      # which only the managed host can see, so it runs inside the agent
      # container.
      - name: Run Phase 7 file manager checks
        run: docker compose exec -T agent sh /tests/integration/phase7_files.sh

      - name: Run Phase 7.5 code editor checks
        run: docker compose exec -T agent sh /tests/integration/phase75_editor.sh

      # Everything else, discovered rather than listed. This job used to stop
      # at phase 7.5 and name each suite by hand, so twenty-eight of them -
      # databases, DNS, mail, backups, deployments, tenancy, and every suite
      # written since - were never run by CI at all.
      - name: Run every remaining integration suite
        run: sh tests/run-integration.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # The deployment path: installing onto a host that has nothing on it, on both
  # platforms this panel claims to support, and checking the archive is what it
  # says it is.
  #
  # None of this was in CI. A stray unescaped "$" in a comment inside the nginx
  # heredoc once made the installer abort before it configured anything - and
  # every other job stayed green, because nothing else executes that file.
  deployment:
    name: Installer and release
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build the installable artefacts
        run: make dist

      - name: Build the previous release, to upgrade from
        run: make dist-previous

      - name: Install onto a clean Alpine host
        run: docker compose -f docker-compose.test.yml run --rm installer-test

      # The script rather than the make targets: those depend on `dist`, which
      # rebuilds every artefact, and it was built once above.
      - name: Install onto a clean Debian 12 host running systemd
        run: sh tests/installer/systemd-host.sh installer-host-debian

      - name: Install onto a clean Ubuntu 22.04 host running systemd
        run: sh tests/installer/systemd-host.sh installer-host-ubuntu-2204

      - name: Install onto a clean Ubuntu 24.04 host running systemd
        run: sh tests/installer/systemd-host.sh installer-host-ubuntu-2404

      # Two hosts: a panel backup taken on one, restored onto the other with
      # only the archive and the exported key carried across.
      # The previous release, installed and used through its own API, then
      # updated to this tree. Every other installer check updates a build to
      # itself. Not Ubuntu 22.04: the previous release could not sign anybody
      # in there, so there is no installation of it to upgrade.
      - name: Upgrade the previous release with data on Debian 12
        run: sh tests/installer/upgrade.sh upgrade-host-debian
      - name: Upgrade the previous release with data on Ubuntu 24.04
        run: sh tests/installer/upgrade.sh upgrade-host-ubuntu-2404

      - name: Rebuild a panel on a second host from a panel backup
        run: sh tests/recovery/panel_restore_drill.sh

      - name: Check the release archive against what it claims to be
        run: make release
      - name: Verify it
        run: make release-verify

  # What the panel does under load, what it refuses to an attacker, and what
  # survives losing the API, the Agent or the database.
  resilience:
    name: Hardening and recovery
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for healthy services
        run: |
          for _ in $(seq 1 40); do
            state="$(docker compose ps --format '{{.Health}}' api nginx | sort -u | tr '\n' ' ')"
            case "$state" in
              *unhealthy*) echo "A service is unhealthy"; docker compose ps; exit 1 ;;
            esac
            if [ "$state" = "healthy " ]; then
              echo "Stack is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for healthy services"
          docker compose ps
          exit 1

      - name: Create the integration administrator
        run: |
          docker compose exec -T -e JOTHOST_ADMIN_USERNAME=integration_admin -e JOTHOST_ADMIN_PASSWORD=integration-admin-pw-9271 api jothost-api create-admin

      - name: Adversarial checks
        run: docker compose -f docker-compose.test.yml run --rm security-audit

      - name: Load
        run: docker compose -f docker-compose.test.yml run --rm load-test

      # Last, because it stops services on purpose. It puts them back, but a
      # check that ran after it would be reporting on a stack that had just
      # been through three outages.
      - name: Recovery drills
        run: sh tests/recovery/phase24_recovery.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
