# Managed by the JotHost development image.
#
# Alpine's OpenRC service expects the cluster under /var/lib/postgresql/<version>,
# and this image keeps it at /var/lib/postgresql/data — which is the path the
# entrypoint initialises and the path the panel's Phase 8 databases live in.
# Without this, starting PostgreSQL through the service manager would create a
# second, empty cluster beside the real one.
data_dir="/var/lib/postgresql/data"
