# Development reverse proxy: one origin in front of the Vite dev server and
# the Go API, mirroring the production topology in ARCHITECTURE.md section 2.

upstream jothost_frontend {
    server frontend:5173;
}

upstream jothost_api {
    server api:8080;
}

# phpMyAdmin is served by the nginx inside the Agent container, under the
# server_name the Agent gave it. In production both live on one host and this
# is 127.0.0.1:80.
upstream jothost_pma {
    server agent:80;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Uploads are bounded here as well as in the API.
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://jothost_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # phpMyAdmin, when the Agent has installed it.
    #
    # On the panel's own origin rather than on the hostname the Agent gives it,
    # because phpMyAdmin's login is a POST carrying a CSRF token bound to the
    # session cookie set on the page the form came from. Reading that page is
    # something only same-origin JavaScript may do, so a cross-origin tab can
    # offer a login form and never a signed-in session.
    #
    # phpMyAdmin still authenticates its own visitors with a real database
    # account. This proxy carries the request; it does not vouch for whoever
    # sent it.
    location /phpmyadmin/ {
        proxy_pass http://jothost_pma/;
        proxy_http_version 1.1;
        proxy_set_header Host phpmyadmin.internal;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # The server block sends X-Frame-Options: DENY. phpMyAdmin sets its own
        # framing policy and the panel opens it in a tab, not a frame, so the
        # header is left to phpMyAdmin rather than overridden here.
    }

    location = /healthz {
        proxy_pass http://jothost_api;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://jothost_api;
        proxy_set_header Host $host;
    }

    # Vite dev server, including its HMR WebSocket.
    location / {
        proxy_pass http://jothost_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
