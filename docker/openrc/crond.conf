# Managed by the JotHost development image.
#
# -c names the crontab directory, which is where the Agent writes. -L sends
# cron's own log to a file: this container runs no syslog daemon, so the default
# would discard it, and the panel's log viewer reads this path as its "cron"
# source.
CRON_OPTS="-c /etc/crontabs -L /var/log/crond.log"
