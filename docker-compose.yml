# JotHost Panel — development environment.
#
# Windows is only the host OS: every Linux-specific behaviour runs inside these
# containers (ARCHITECTURE.md section 16).
#
# Bring the stack up with:  make dev      (or: docker compose up -d --build)

name: jothost

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jothost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jothost_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jothost}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jothost} -d ${POSTGRES_DB:-jothost}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      target: runtime
    # A fixed hostname, because the panel identifies the host it manages by
    # name. Docker's default is the container id, which changes on every
    # rebuild — so every rebuild looked like a different server, and the
    # databases and accounts recorded against the previous one were left
    # attached to a host that no longer exists. On a real machine the hostname
    # is stable; this makes development behave the same way.
    hostname: jothost-agent
    # An init process as PID 1, whose one job is to reap orphaned children.
    #
    # On a real host that is what init does, and the panel's service manager
    # depends on it: OpenRC's start-stop-daemon decides a service stopped by
    # looking for the process afterwards, and an unreaped zombie is still in the
    # process table. Without this, stopping nginx here killed it and then
    # reported "1 process refused to stop" — a true failure message about a
    # successful stop, which is the worst kind. In this container the Agent
    # itself is PID 1 and is not an init system, so Docker supplies one.
    init: true
    # The firewall needs to read and write packet filter rules, which needs
    # NET_ADMIN. It applies to this container's own network namespace only, so
    # a rule the panel writes here affects nothing outside it — which is what
    # makes the dangerous half of Phase 16 testable: connectivity can be broken
    # on purpose and the rollback watched, without touching the machine running
    # Docker. A real host gives the Agent this because it runs as root.
    cap_add:
      - NET_ADMIN
    environment:
      JOTHOST_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      AGENT_SOCKET: /run/jothost/agent.sock
      AGENT_OPERATION_TIMEOUT: 30s
      AGENT_MAX_CONCURRENT: 16
      # Shared secret authenticating the API to the Agent. Development default
      # only; production must supply its own.
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-agent-token-0123456789abcdef0123456789abcdef}
      # UID 10001 is the API container's jothost user. Peer credentials come
      # from the kernel and cannot be forged by the caller.
      AGENT_ALLOWED_UIDS: ${AGENT_ALLOWED_UIDS:-10001}
      AGENT_AUDIT_LOG: /var/log/jothost/agent-audit.log
      AGENT_MAX_CONCURRENT_JOBS: 4
      AGENT_JOB_RETENTION: 15m
      # Alpine puts nginx in /usr/sbin and the shadow tools in /usr/sbin.
      AGENT_NGINX_PATH: /usr/sbin/nginx
      AGENT_NGINX_SITES_DIR: /etc/nginx/conf.d
      # The panel's own nginx binds to loopback on a real host, because its
      # applications are reached through the panel's public vhost and nothing
      # else should be able to. Here the public nginx is a different container,
      # where loopback inside this one is reachable by nothing at all.
      AGENT_PANEL_WEB_LISTEN: 0.0.0.0
      AGENT_SITE_ROOT: /var/www
      # Both database servers run inside this container, reached over their
      # Unix sockets. Neither listens on a port, and neither is the panel's own
      # control-plane PostgreSQL, which is a separate service.
      AGENT_MYSQL_PATH: /usr/bin/mariadb
      AGENT_MYSQL_SOCKET: /run/mysqld/mysqld.sock
      AGENT_MYSQL_ADMIN_USER: root
      AGENT_PSQL_PATH: /usr/bin/psql
      AGENT_POSTGRES_HOST: /run/postgresql
      AGENT_POSTGRES_ADMIN_USER: postgres
      # Development default only. Production supplies its own; the Agent never
      # puts it in argv, only in a mode-0600 pgpass file it reads through
      # PGPASSFILE.
      AGENT_POSTGRES_ADMIN_PASSWORD: ${AGENT_POSTGRES_ADMIN_PASSWORD:-jothost_pg_admin_dev}

      # Backups. The working directory stages an archive before it is sent
      # anywhere, so it holds a complete copy of whatever is being backed up.
      # The local roots bound where a *local* destination may write; without
      # them "back up to /etc/nginx" would be a way to write a file anywhere on
      # this host as root.
      AGENT_BACKUP_WORK_DIR: /var/lib/jothost/backups
      AGENT_BACKUP_LOCAL_ROOTS: /var/lib/jothost/backups,/backups
      # Alpine's mariadb-client installs the dump tool under its own name; the
      # mysqldump symlink is not always present.
      AGENT_MYSQLDUMP_PATH: /usr/bin/mariadb-dump
      AGENT_PG_DUMP_PATH: /usr/bin/pg_dump
      AGENT_SFTP_PATH: /usr/bin/sftp
    ports:
      # Websites the panel creates are served by the nginx this container
      # manages. This is the managed host's HTTP port, not the panel's.
      - "${SITES_PORT:-8090}:80"
      # HTTPS for the sites the panel creates, so the certificate a site is
      # issued can actually be handshaken with from the host.
      - "${SITES_TLS_PORT:-8443}:443"
    volumes:
      # The socket directory is the only channel between API and Agent.
      # No port is published: the Agent must never be reachable over TCP.
      - agent-socket:/run/jothost
      - agent-audit:/var/log/jothost
      # Website content survives a rebuild of this image.
      #
      # This container is the managed host in development, and its filesystem is
      # otherwise thrown away every time the image is rebuilt — which silently
      # deletes every site while the database goes on listing them as active.
      # Vhosts, FPM pools and system accounts are all regenerated by the panel;
      # what a customer put in their document root is not.
      - agent-sites:/var/www
      # Managed database data, kept for the same reason as the site content
      # above: rebuilding this image would otherwise silently destroy every
      # database while the panel went on listing them as active.
      # The Unix accounts the panel creates per website. See the entrypoint:
      # /etc/passwd is part of the image, so a rebuild would otherwise delete
      # every site's owner while its files survive in the volume above.
      - agent-accounts:/var/lib/jothost/accounts
      # Mail, for the same reason as the site content and the databases above,
      # and more sharply. A rebuild of this image discards the writable layer:
      # the panel regenerates Postfix's tables and Dovecot's passwd-file from
      # its own record, so those come back on the next reconcile — but the
      # Maildirs are customers' messages and the DKIM keys are deliberately
      # stored nowhere else (docs/PHASE26.md), and neither can be regenerated
      # from anything. Without these two volumes a rebuild would silently
      # destroy every message on the host while the panel went on listing the
      # mailboxes as present.
      - agent-mail:/var/mail/vhosts
      - agent-mailstate:/var/lib/jothost/mail
      - agent-mysql:/var/lib/mysql
      - agent-pgdata:/var/lib/postgresql
      # The Phase 2 checks run inside this container, against a live Agent.
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/jothost-agent", "-ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot initialises two database servers before the Agent starts,
      # which takes far longer than a restart does.
      start_period: 90s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    # Fixed for the same reason as the agent's: it is the fallback identity
    # used when the Agent cannot be reached at startup.
    hostname: jothost-api
    environment:
      JOTHOST_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      API_HTTP_ADDR: ":8080"
      # Where a notification's link points. Empty leaves the link out rather
      # than sending a relative path nobody can follow.
      PANEL_URL: ${PANEL_URL:-http://localhost:8081}
      DATABASE_URL: postgres://${POSTGRES_USER:-jothost}:${POSTGRES_PASSWORD:-jothost_dev_password}@postgres:5432/${POSTGRES_DB:-jothost}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AGENT_SOCKET: /run/jothost/agent.sock
      AGENT_TIMEOUT: 30s
      # Must match the Agent's AGENT_TOKEN.
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-agent-token-0123456789abcdef0123456789abcdef}
      MIGRATIONS_DIR: /app/migrations
      AUTO_MIGRATE: "true"
      # Development key only. Production must supply its own; losing it makes
      # every stored 2FA secret undecryptable.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_IP_RATE_LIMIT: ${LOGIN_IP_RATE_LIMIT:-20}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-15m}
      TOTP_ISSUER: ${TOTP_ISSUER:-JotHost Panel}
      METRIC_SAMPLE_INTERVAL: ${METRIC_SAMPLE_INTERVAL:-30s}
      METRIC_RETENTION: ${METRIC_RETENTION:-720h}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - agent-socket:/run/jothost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Source is bind-mounted for hot reload; node_modules stays in the image
      # so Linux-native binaries are not overwritten by the Windows host tree.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PANEL_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  agent-socket:
  agent-audit:
  agent-sites:
  agent-accounts:
  agent-mail:
  agent-mailstate:
  agent-mysql:
  agent-pgdata:
