# JotHost Panel — test profile.
#
# Runs every suite inside Linux containers so results match production
# (ARCHITECTURE.md section 16). Used by:  make docker-test
#
#   go-tests         unit + security tests for shared, api, agent
#   frontend-tests   vitest suite
#   integration      Phase 0 black-box checks against the running dev stack
#   auth-integration Phase 1 authentication checks against the running stack
#   dashboard-integration  Phase 3 dashboard checks against the running stack
#
# go-tests brings its own throwaway Postgres and Redis so the suite never
# touches development data.

name: jothost-test

services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jothost_test
      POSTGRES_PASSWORD: jothost_test
      POSTGRES_DB: jothost_test
    # Test data is disposable, so durability is traded for speed.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jothost_test -d jothost_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  test-redis:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  go-tests:
    image: golang:1.23-alpine
    working_dir: /src
    environment:
      GOFLAGS: -mod=mod
      GOCACHE: /tmp/gocache
      CGO_ENABLED: "0"
      TEST_DATABASE_URL: postgres://jothost_test:jothost_test@test-postgres:5432/jothost_test?sslmode=disable
      TEST_REDIS_URL: redis://test-redis:6379/0
      TEST_MIGRATIONS_DIR: /src/migrations
    volumes:
      - ./:/src:ro
      - go-build-cache:/tmp/gocache
      - go-mod-cache:/go/pkg/mod
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command:
      - sh
      - -euc
      - |
        for module in shared api agent; do
          echo "=== go test ./... ($$module) ==="
          (cd "/src/$$module" && go vet ./... && go test -p 1 -count=1 ./...)
        done

  frontend-tests:
    image: node:22-alpine
    working_dir: /app
    environment:
      CI: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command:
      - sh
      - -euc
      - |
        npm ci
        npm run lint
        npm run typecheck
        npm run test

  integration:
    image: alpine:3.21
    environment:
      # Reached over the compose network of the running dev stack.
      API_BASE_URL: ${INTEGRATION_API_URL:-http://api:8080}
      PANEL_BASE_URL: ${INTEGRATION_PANEL_URL:-http://nginx:80}
    volumes:
      - ./tests:/tests:ro
    networks:
      - jothost_default
    command: ["sh", "/tests/integration/phase0_smoke.sh"]

  dashboard-integration:
    image: alpine:3.21
    environment:
      API_BASE_URL: ${INTEGRATION_API_URL:-http://api:8080}
      INTEGRATION_ADMIN_USERNAME: ${INTEGRATION_ADMIN_USERNAME:-integration_admin}
      INTEGRATION_ADMIN_PASSWORD: ${INTEGRATION_ADMIN_PASSWORD:-integration-admin-pw-9271}
    volumes:
      - ./tests:/tests:ro
    networks:
      - jothost_default
    command: ["sh", "/tests/integration/phase3_dashboard.sh"]

  websites-integration:
    image: alpine:3.21
    environment:
      API_BASE_URL: ${INTEGRATION_API_URL:-http://api:8080}
      # The Agent container runs the nginx that serves created websites; it is
      # a different host from the panel's own reverse proxy.
      SITES_BASE_URL: ${INTEGRATION_SITES_URL:-http://agent:80}
      INTEGRATION_ADMIN_USERNAME: ${INTEGRATION_ADMIN_USERNAME:-integration_admin}
      INTEGRATION_ADMIN_PASSWORD: ${INTEGRATION_ADMIN_PASSWORD:-integration-admin-pw-9271}
    volumes:
      - ./tests:/tests:ro
    networks:
      - jothost_default
    command: ["sh", "/tests/integration/phase4_websites.sh"]

  auth-integration:
    image: alpine:3.21
    environment:
      API_BASE_URL: ${INTEGRATION_API_URL:-http://api:8080}
      # Credentials for the account created by `make docker-test-integration`.
      INTEGRATION_ADMIN_USERNAME: ${INTEGRATION_ADMIN_USERNAME:-integration_admin}
      INTEGRATION_ADMIN_PASSWORD: ${INTEGRATION_ADMIN_PASSWORD:-integration-admin-pw-9271}
    volumes:
      - ./tests:/tests:ro
    networks:
      - jothost_default
    command: ["sh", "/tests/integration/phase1_auth.sh"]

  # An S3-compatible service, for the Phase 14 backup checks.
  #
  # It lives here rather than in the dev stack because it is not part of the
  # panel: it stands in for somebody's object storage, and a dev stack that ran
  # one permanently would be a container nobody asked for. `make
  # docker-test-backup` starts it, the checks drive it, and it goes away.
  #
  # It is on the dev stack's network because the Agent is what talks to it, and
  # the Agent runs there.
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jothost_backup_test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jothost-backup-test-secret}
    command: ["server", "/data", "--address", ":9000"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - jothost_default

  # Creates the bucket the checks write into.
  #
  # A separate one-shot container rather than a pre-made directory: MinIO's
  # on-disk layout is its own business, and a test that depended on it would
  # break on an upgrade for reasons that had nothing to do with this panel.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -euc
      - |
        mc alias set target http://minio:9000 \
          "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing target/jothost-backups
        echo "bucket ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jothost_backup_test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jothost-backup-test-secret}
    networks:
      - jothost_default

  # A real SMTP server that keeps what it receives, for the Phase 20 checks.
  #
  # It lives here rather than in the dev stack for the same reason MinIO does:
  # it stands in for somebody's mail relay, and a dev stack that ran one
  # permanently would be a container nobody asked for. `make
  # docker-test-notifications` starts it, the checks drive it, and it goes away.
  #
  # It is on the dev stack's network because the API is what sends mail, and the
  # API runs there.
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - jothost_default

  # A clean Linux host for the Phase 23 installer.
  #
  # alpine:3.21 with nothing added: no nginx, no PostgreSQL, no Redis, no
  # panel. That emptiness is the point — an installer tested on the development
  # image would be tested against a machine that already had everything it was
  # supposed to install.
  #
  # It runs with its own init (OpenRC is installed by the installer itself) and
  # needs no privileges: everything the checks exercise is package installation,
  # file writing, process starting and HTTP.
  installer-test:
    image: alpine:3.21
    working_dir: /src
    environment:
      # A name that resolves to this container, so the final health check is a
      # real request over the network on the panel's own domain rather than a
      # request to localhost dressed up as one.
      PANEL_DOMAIN: ${INSTALLER_TEST_DOMAIN:-panel.installer.test}
    volumes:
      - ./dist:/dist:ro
      - ./tests:/tests:ro
    command: ["sh", "/tests/integration/phase23_installer.sh"]

volumes:
  go-build-cache:
  go-mod-cache:
  frontend-node-modules:

networks:
  # Attaches to the network created by docker-compose.yml so the integration
  # container can reach the running services by name.
  jothost_default:
    external: true
