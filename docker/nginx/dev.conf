# Development reverse proxy: one origin in front of the Vite dev server and
# the Go API, mirroring the production topology in ARCHITECTURE.md section 2.

upstream jothost_frontend {
    server frontend:5173;
}

upstream jothost_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Uploads are bounded here as well as in the API.
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://jothost_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://jothost_api;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://jothost_api;
        proxy_set_header Host $host;
    }

    # Vite dev server, including its HMR WebSocket.
    location / {
        proxy_pass http://jothost_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
