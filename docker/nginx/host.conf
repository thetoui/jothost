# nginx configuration for the managed host.
#
# This is the nginx the Agent drives: it serves the websites the panel creates,
# not the panel itself. The panel's own reverse proxy is a separate service
# (docker/nginx/dev.conf).
#
# Generated vhosts land in conf.d/, one file per website.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the version to every visitor of every hosted site.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # A request for a name no site claims must not be silently served by
    # whichever vhost happens to load first. This default returns 404 so an
    # unconfigured hostname is unambiguous.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        access_log off;
        return 404;
    }

    # Websites created by the panel.
    include /etc/nginx/conf.d/*.conf;
}
